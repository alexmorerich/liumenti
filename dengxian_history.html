// ─── Canvas setup ──────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', ()=>{ resize(); });

// Convert geo coords to canvas pixels
function px(lon,lat){
  const g = geo(lon,lat);
  return { x: g.x * W, y: g.y * H };
}

// ─── Drawing helpers ────────────────────────────────────────────────────────
function drawMountains(){
  MOUNTAINS.forEach(m => {
    const c = px(m.cx, m.cy);
    const rx = (m.rx/(LON1-LON0)) * W;
    const ry = (m.ry/(LAT0-LAT1)) * H;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(m.a);
    const grad = ctx.createRadialGradient(0,0,0, 0,0, Math.max(rx,ry));
    grad.addColorStop(0,'rgba(100,80,40,0.30)');
    grad.addColorStop(1,'rgba(80,60,30,0.00)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(190,160,90,0.65)';
    ctx.font = `${Math.max(10, W*0.012)}px SimSun,serif`;
    ctx.textAlign = 'center';
    ctx.fillText(m.name, c.x, c.y);
  });
}

function drawRivers(){
  RIVERS.forEach(r => {
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.lw * (W/1200);
    ctx.lineJoin = 'round';
    ctx.setLineDash([]);
    ctx.beginPath();
    r.pts.forEach((p,i) => {
      const {x,y} = px(p[0],p[1]);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
    // label near middle
    const mid = r.pts[Math.floor(r.pts.length/2)];
    const mp = px(mid[0],mid[1]);
    ctx.fillStyle = r.color;
    ctx.font = `italic ${Math.max(9,W*0.009)}px SimSun,serif`;
    ctx.textAlign = 'left';
    ctx.fillText(r.name, mp.x+4, mp.y-4);
  });
}

function drawGrid(){
  // Light geographic grid lines every 1 degree
  ctx.strokeStyle = 'rgba(150,120,60,0.08)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([4,8]);
  for(let lon=110; lon<=114; lon++){
    const a=px(lon,LAT0), b=px(lon,LAT1);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for(let lat=32; lat<=34; lat++){
    const a=px(LON0,lat), b=px(LON1,lat);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawNanyanBasin(){
  // Highlight the Nanyang basin (盆地) gently
  const c = px(112.20, 32.75);
  const grad = ctx.createRadialGradient(c.x,c.y,0, c.x,c.y, W*0.25);
  grad.addColorStop(0,'rgba(80,120,60,0.12)');
  grad.addColorStop(1,'rgba(80,120,60,0.00)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, W*0.26, H*0.22, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(140,180,100,0.30)';
  ctx.font = `${Math.max(11,W*0.013)}px SimSun,serif`;
  ctx.textAlign = 'center';
  ctx.fillText('南阳盆地', c.x+W*0.08, c.y+H*0.06);
}

function drawCity(city, alpha){
  const p = px(city.lon, city.lat);
  const fs = Math.max(10, W*0.011);
  ctx.globalAlpha = alpha;

  if(city.type === 'capital'){
    // Outer glow
    const g = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y, 22);
    g.addColorStop(0, city.color+'55');
    g.addColorStop(1, city.color+'00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,Math.PI*2); ctx.fill();
    // Square marker (city)
    ctx.fillStyle = city.color;
    ctx.fillRect(p.x-5,p.y-5,10,10);
    ctx.strokeStyle='#ffffff66';
    ctx.lineWidth=1;
    ctx.strokeRect(p.x-5,p.y-5,10,10);
    ctx.fillStyle = '#fff8e0';
    ctx.font = `bold ${fs+1}px SimSun,serif`;
    ctx.textAlign = 'center';
    ctx.fillText(city.name, p.x, p.y-10);
  } else if(city.type === 'county'){
    ctx.fillStyle = city.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ece0c0';
    ctx.font = `${fs}px SimSun,serif`;
    ctx.textAlign = 'center';
    ctx.fillText(city.name, p.x, p.y-8);
  } else if(city.type === 'water-project'){
    // Wave marker
    ctx.strokeStyle = city.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=0;i<3;i++){
      ctx.arc(p.x+(i-1)*8, p.y, 4, Math.PI, 0, false);
    }
    ctx.stroke();
    ctx.fillStyle = city.color;
    ctx.font = `bold ${fs}px SimSun,serif`;
    ctx.textAlign = 'center';
    ctx.fillText('〜'+city.name, p.x, p.y-10);
  } else if(city.type === 'site'){
    ctx.fillStyle = city.color+'aa';
    ctx.font = `${fs-1}px SimSun,serif`;
    ctx.textAlign = 'center';
    ctx.fillText('※ '+city.name, p.x, p.y);
  } else if(city.type === 'neighbor'){
    ctx.fillStyle = city.color+'99';
    ctx.font = `${fs-1}px SimSun,serif`;
    ctx.textAlign = 'center';
    ctx.fillText(city.name, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawHighlight(h, alpha){
  if(!h) return;
  const p = px(h.lon, h.lat);
  ctx.globalAlpha = alpha * 0.5;
  ctx.strokeStyle = '#ffd70088';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,5]);
  ctx.beginPath();
  ctx.arc(p.x, p.y, h.r * (W/1200), 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffd700cc';
  ctx.font = `bold ${Math.max(11,W*0.011)}px SimSun,serif`;
  ctx.textAlign = 'center';
  ctx.fillText(h.label, p.x, p.y + h.r*(W/1200) + 16);
}

function drawCompass(){
  const cx = W*0.94, cy = H*0.92, r=18;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#8b6914'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2); ctx.stroke();
  ['北','东','南','西'].forEach((d,i)=>{
    const a = i*Math.PI/2 - Math.PI/2;
    const tx = cx + Math.cos(a)*r;
    const ty = cy + Math.sin(a)*r;
    ctx.fillStyle = d==='北'?'#ff6060':'#c8a870';
    ctx.font = `bold ${Math.max(10,W*0.010)}px SimSun,serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(d, tx, ty);
  });
  ctx.textBaseline='alphabetic';
}

function drawScale(){
  // 1 degree lon ≈ 91km at this latitude; draw 100km scale bar
  const barKm = 100;
  const degPer100km = barKm/91;
  const barPx = (degPer100km/(LON1-LON0))*W;
  const x0=W*0.05, y0=H*0.94, y1=y0-5;
  ctx.strokeStyle='#c8a870'; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x0,y0); ctx.lineTo(x0+barPx,y0);
  ctx.moveTo(x0,y0); ctx.lineTo(x0,y1);
  ctx.moveTo(x0+barPx,y0); ctx.lineTo(x0+barPx,y1);
  ctx.stroke();
  ctx.fillStyle='#c8a870';
  ctx.font=`${Math.max(10,W*0.010)}px SimSun,serif`;
  ctx.textAlign='center';
  ctx.fillText('100 km', x0+barPx/2, y0+14);
}

// ─── State & animation ─────────────────────────────────────────────────────
let eraIdx = 0;
let alpha = 1, fadingOut = false, fadeCb = null;
let playing = true;
let timer = null;

function render(){
  const era = ERAS[eraIdx];
  // Background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, era.bgA);
  bg.addColorStop(1, era.bgB);
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  ctx.globalAlpha = alpha;
  drawGrid();
  drawMountains();
  drawNanyanBasin();
  drawRivers();
  era.cities.forEach(c => drawCity(c, 1));
  drawHighlight(era.highlight, 1);
  ctx.globalAlpha = 1;
  drawCompass();
  drawScale();
}

function animLoop(){
  if(fadingOut){
    alpha -= 0.07;
    if(alpha<=0){ alpha=0; fadingOut=false; if(fadeCb){fadeCb();fadeCb=null;} }
  } else if(alpha<1){
    alpha += 0.07;
    if(alpha>1) alpha=1;
  }
  render();
  requestAnimationFrame(animLoop);
}

function goTo(idx){
  fadingOut = true;
  fadeCb = () => {
    eraIdx = (idx+ERAS.length)%ERAS.length;
    updateUI();
  };
}

function updateUI(){
  const era = ERAS[eraIdx];
  document.getElementById('era-name').textContent = era.name;
  document.getElementById('era-year').textContent = era.year;
  document.getElementById('era-desc').textContent = era.desc;
  document.getElementById('pfill').style.width = (eraIdx/(ERAS.length-1)*100)+'%';
  const notable = era.cities.filter(c=>c.type!=='neighbor');
  document.getElementById('place-list').innerHTML =
    notable.map(c=>`<span style="color:${c.color}">${c.name}</span> → ${c.modern}`).join('<br>');
}

function startTimer(){
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{ if(playing) goTo(eraIdx+1); }, 5000);
}

document.getElementById('bplay').onclick=()=>{
  playing=!playing;
  document.getElementById('bplay').textContent = playing?'⏸ 暂停':'▶ 播放';
};
document.getElementById('bnext').onclick=()=>goTo(eraIdx+1);
document.getElementById('bprev').onclick=()=>goTo(eraIdx-1);

// Touch swipe support
let tx0=null;
canvas.addEventListener('touchstart',e=>{ tx0=e.touches[0].clientX; },{passive:true});
canvas.addEventListener('touchend',e=>{
  if(tx0===null) return;
  const dx = e.changedTouches[0].clientX - tx0;
  if(Math.abs(dx)>40){ dx<0?goTo(eraIdx+1):goTo(eraIdx-1); }
  tx0=null;
});

updateUI();
startTimer();
animLoop();
</script>
